; Plataforma estabilizadora de pelota - firmware ESP32
; Uso:
;   pio run                 compila para la placa
;   pio run -t upload       carga por USB
;   pio device monitor      abre el monitor serie
;   pio test -e native      corre los tests de PID y protocolo en la PC

[platformio]
default_envs = esp32dev

[env:esp32dev]
; Versiones probadas en este repositorio.
platform = espressif32@8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
monitor_filters = time, esp32_exception_decoder
lib_deps =
    madhephaestus/ESP32Servo@3.2.1

; Entorno de tests nativos: no necesita la placa ni el framework Arduino.
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<pid.cpp> +<protocol.cpp>
build_flags =
    -std=gnu++17
    -Wall
